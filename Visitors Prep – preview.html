<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visitors Prep – preview</title>
<meta name="theme-color" content="#F6D9CE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visitors">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<script>window.APP_CONFIG={};</script>
<style>
:root{
  --paper:#FFFDFB; --surface:#FFFFFF; --ink:#2B2A33; --soft:#6F6A72; --faint:#A39DA2;
  --band:#F6D9CE; --band-ink:#5B3A33; --rule:#EFE5E0; --chip:#F7EEEA;
  --tick:#4F8A62; --tick-soft:#E3F0E6; --warn:#B0472F; --shadow:0 10px 30px rgba(60,30,20,.18);
  --hand:'Caveat','Bradley Hand','Segoe Print',cursive;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#1C1A1F; --surface:#252229; --ink:#F1ECEA; --soft:#B2AAAE; --faint:#7E777C;
    --band:#4A3631; --band-ink:#F6D9CE; --rule:#34303A; --chip:#2F2A31;
    --tick:#7CC191; --tick-soft:#24352A; --warn:#E89079; --shadow:0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.35;-webkit-tap-highlight-color:transparent;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--tick);outline-offset:2px;border-radius:10px}
.wrap{max-width:640px;margin:0 auto}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--band);color:var(--band-ink);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px}
.toprow{display:flex;align-items:center;gap:10px}
h1{margin:0;flex:1;font-family:var(--hand);font-weight:600;font-size:2.1rem;line-height:1}
.me{display:flex;align-items:center;gap:8px;border:0;background:color-mix(in srgb,var(--paper) 70%,transparent);border-radius:999px;padding:5px 12px 5px 5px;font-weight:600;font-size:.95rem}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;color:var(--band-ink)}
.progress{display:flex;align-items:center;gap:10px;margin:12px 0 12px}
.bar{flex:1;height:10px;border-radius:5px;background:color-mix(in srgb,var(--band-ink) 15%,transparent);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--tick);border-radius:5px;transition:width .4s ease}
.count{font-weight:600;font-size:.9rem;white-space:nowrap}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:0;border-radius:999px;padding:8px 14px;background:color-mix(in srgb,var(--paper) 45%,transparent);color:var(--band-ink);font-weight:600;font-size:.9rem}
.filters button[aria-pressed="true"]{background:var(--band-ink);color:var(--band)}

/* avatar */
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.85rem}
.av.lg{width:46px;height:46px;font-size:1.15rem}

/* people summary */
.people{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.pcard{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:8px 12px 8px 8px;font-size:.85rem}
.pcard b{display:block;font-size:.9rem}
.pcard span{color:var(--soft)}

.status{padding:6px 16px 0;color:var(--soft);font-size:.82rem;text-align:right}
.banner{margin:12px 16px 0;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:.9rem}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
[hidden]{display:none!important}

/* sections */
section{margin:14px 12px 0;background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.sechead{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:14px 14px;text-align:left}
.sechead .em{font-size:1.3rem}
.sechead .nm{flex:1;font-weight:700}
.sechead .ct{color:var(--soft);font-size:.9rem;font-weight:600}
.sechead .chev{transition:transform .2s;color:var(--faint)}
section.closed .chev{transform:rotate(-90deg)}
section.closed ul, section.closed .add{display:none}
section.complete .ct{color:var(--tick)}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
li{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-bottom:1px solid var(--rule);min-height:60px}
li:last-child{border-bottom:0}
.tick{flex:none;border:0;background:transparent;width:48px;height:48px;display:grid;place-items:center;border-radius:12px}
.box{width:28px;height:28px;border:2px solid var(--faint);border-radius:8px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s}
li.done .box{background:var(--tick);border-color:var(--tick)}
li.done .box svg{opacity:1;transform:scale(1)}
.body{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:6px 0}
.label{display:block}
.meta{display:block;font-family:var(--hand);font-size:1.2rem;line-height:1.1;color:var(--tick)}
li.done .label{color:var(--soft);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--soft) 55%,transparent)}
.who{flex:none;border:0;background:transparent;padding:4px;border-radius:999px;display:flex;align-items:center}
.claim{border:1.5px dashed var(--faint);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;color:var(--soft)}
.add{display:block;width:100%;border:0;border-top:1px solid var(--rule);background:transparent;padding:12px 16px;text-align:left;color:var(--soft);font-weight:600;font-size:.9rem}
.hide-done li.done{display:none}
.empty{margin:30px 20px;text-align:center;color:var(--soft)}
.empty strong{display:block;font-family:var(--hand);font-size:2rem;color:var(--tick)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,10,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;background:var(--paper);border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:var(--shadow);max-height:88vh;overflow-y:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h2{margin:0 0 4px;font-size:1.15rem}
.sheet p{margin:0 0 14px;color:var(--soft);font-size:.92rem}
.opt{width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--rule);background:var(--surface);border-radius:14px;padding:12px;margin-bottom:8px;text-align:left;font-weight:600}
.opt.sel{border-color:var(--tick);box-shadow:inset 0 0 0 1px var(--tick)}
.opt.danger{color:var(--warn)}
.opt small{display:block;font-weight:400;color:var(--soft)}
.opt.plain{justify-content:center;background:transparent}
.field{width:100%;font:inherit;font-size:16px;padding:14px;margin-bottom:10px;border:1px solid var(--rule);border-radius:14px;background:var(--surface);color:var(--ink)}
.field:focus-visible{outline:3px solid var(--tick);outline-offset:1px}
.opt.go{justify-content:center;background:var(--tick);border-color:var(--tick);color:var(--paper)}
.welcome{position:fixed;inset:0;z-index:30;background:var(--band);color:var(--band-ink);display:flex;flex-direction:column;justify-content:center;padding:24px}
.welcome .inner{max-width:420px;margin:0 auto;width:100%}
.welcome h2{font-family:var(--hand);font-size:2.6rem;margin:0 0 6px;line-height:1}
.welcome p{margin:0 0 20px}
.welcome .opt{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:40;box-shadow:var(--shadow);max-width:90vw}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="toprow">
      <h1>Visitors prep</h1>
      <button class="me" id="meBtn" aria-label="Change who is using this phone"></button>
      <button class="iconbtn" id="menuBtn" aria-label="Menu">⋯</button>
    </div>
    <div class="progress"><div class="bar"><span id="bar"></span></div><div class="count" id="count"></div></div>
    <div class="filters" id="filters"></div>
  </header>

  <div class="banner" id="banner" hidden></div>
  <div class="people" id="people"></div>
  <div class="status" id="status"></div>
  <main id="main"></main>
</div>

<div id="overlay"></div>
<div class="toast" id="toast" hidden></div>

<script>
const DATA = {"cats": [{"id": "bedrooms", "name": "Bedrooms & office", "emoji": "🛏️"}, {"id": "living", "name": "Lounge, dining & halls", "emoji": "🛋️"}, {"id": "kitchen", "name": "Kitchen", "emoji": "🍳"}, {"id": "bathrooms", "name": "Bathrooms & laundry", "emoji": "🛁"}, {"id": "outdoors", "name": "Outdoors & cars", "emoji": "🌿"}, {"id": "food", "name": "Food", "emoji": "🥗"}, {"id": "drinks", "name": "Drinks & coffee", "emoji": "☕"}, {"id": "table", "name": "Setting the table", "emoji": "🍽️"}], "seed": [{"id": "bedrooms-1", "label": "Dust D&K bedroom", "category": "bedrooms", "sort": 10}, {"id": "bedrooms-2", "label": "Vacuum D&K bedroom", "category": "bedrooms", "sort": 20}, {"id": "bedrooms-3", "label": "Dust Harry’s room", "category": "bedrooms", "sort": 30}, {"id": "bedrooms-4", "label": "Vacuum Harry’s room", "category": "bedrooms", "sort": 40}, {"id": "bedrooms-5", "label": "Dust Misti’s room", "category": "bedrooms", "sort": 50}, {"id": "bedrooms-6", "label": "Vacuum Misti’s room", "category": "bedrooms", "sort": 60}, {"id": "bedrooms-7", "label": "Dust Tara’s room", "category": "bedrooms", "sort": 70}, {"id": "bedrooms-8", "label": "Vacuum Tara’s room", "category": "bedrooms", "sort": 80}, {"id": "bedrooms-9", "label": "Dust Bridget’s room", "category": "bedrooms", "sort": 90}, {"id": "bedrooms-10", "label": "Vacuum Bridget’s room", "category": "bedrooms", "sort": 100}, {"id": "bedrooms-11", "label": "Dust Little room", "category": "bedrooms", "sort": 110}, {"id": "bedrooms-12", "label": "Vacuum Little room", "category": "bedrooms", "sort": 120}, {"id": "bedrooms-13", "label": "Dust office", "category": "bedrooms", "sort": 130}, {"id": "bedrooms-14", "label": "Vacuum office", "category": "bedrooms", "sort": 140}, {"id": "living-1", "label": "Dust lounge", "category": "living", "sort": 150}, {"id": "living-2", "label": "Vacuum lounge", "category": "living", "sort": 160}, {"id": "living-3", "label": "Dust dining room", "category": "living", "sort": 170}, {"id": "living-4", "label": "Vacuum dining room", "category": "living", "sort": 180}, {"id": "living-5", "label": "Dust hallways/stairs", "category": "living", "sort": 190}, {"id": "living-6", "label": "Vacuum hallways/stairs", "category": "living", "sort": 200}, {"id": "living-7", "label": "Wipe furniture – lounge & dining", "category": "living", "sort": 210}, {"id": "living-8", "label": "Remove cobwebs", "category": "living", "sort": 220}, {"id": "living-9", "label": "Clean mirrors", "category": "living", "sort": 230}, {"id": "living-10", "label": "Clean windows inside", "category": "living", "sort": 240}, {"id": "living-11", "label": "Wipe windowsills", "category": "living", "sort": 250}, {"id": "living-12", "label": "Toy cupboard", "category": "living", "sort": 260}, {"id": "kitchen-1", "label": "Clean kitchen bench top", "category": "kitchen", "sort": 270}, {"id": "kitchen-2", "label": "Wipe kitchen cupboards", "category": "kitchen", "sort": 280}, {"id": "kitchen-3", "label": "Wipe kitchen appliances", "category": "kitchen", "sort": 290}, {"id": "kitchen-4", "label": "Clean fridge inside & outside", "category": "kitchen", "sort": 300}, {"id": "kitchen-5", "label": "Clean microwave", "category": "kitchen", "sort": 310}, {"id": "kitchen-6", "label": "Wipe out oven", "category": "kitchen", "sort": 320}, {"id": "kitchen-7", "label": "Clean stovetop", "category": "kitchen", "sort": 330}, {"id": "kitchen-8", "label": "Clean deep fryer", "category": "kitchen", "sort": 340}, {"id": "kitchen-9", "label": "Vacuum kitchen", "category": "kitchen", "sort": 350}, {"id": "bathrooms-1", "label": "Clean main bathroom", "category": "bathrooms", "sort": 360}, {"id": "bathrooms-2", "label": "Clean upstairs bathroom", "category": "bathrooms", "sort": 370}, {"id": "bathrooms-3", "label": "Clean laundry toilet", "category": "bathrooms", "sort": 380}, {"id": "bathrooms-4", "label": "Clean sink & tub", "category": "bathrooms", "sort": 390}, {"id": "bathrooms-5", "label": "Mop floors – kitchen, laundry, bathrooms", "category": "bathrooms", "sort": 400}, {"id": "bathrooms-6", "label": "Change hand towels", "category": "bathrooms", "sort": 410}, {"id": "bathrooms-7", "label": "Laundry", "category": "bathrooms", "sort": 420}, {"id": "outdoors-1", "label": "Mow lawn", "category": "outdoors", "sort": 430}, {"id": "outdoors-2", "label": "Sweep porch & patio", "category": "outdoors", "sort": 440}, {"id": "outdoors-3", "label": "Tidy section/outdoor area", "category": "outdoors", "sort": 450}, {"id": "outdoors-4", "label": "Clean outdoor seats & tables", "category": "outdoors", "sort": 460}, {"id": "outdoors-5", "label": "Clean BBQ", "category": "outdoors", "sort": 470}, {"id": "outdoors-6", "label": "Clean windows outside", "category": "outdoors", "sort": 480}, {"id": "outdoors-7", "label": "Tidy boots", "category": "outdoors", "sort": 490}, {"id": "outdoors-8", "label": "Empty rubbish bins", "category": "outdoors", "sort": 500}, {"id": "outdoors-9", "label": "Sort cars", "category": "outdoors", "sort": 510}, {"id": "food-1", "label": "Organise menu & dishes", "category": "food", "sort": 520}, {"id": "food-2", "label": "Create shopping list", "category": "food", "sort": 530}, {"id": "food-3", "label": "Campus & Co. shop", "category": "food", "sort": 540}, {"id": "food-4", "label": "Fruit & veg shopping", "category": "food", "sort": 550}, {"id": "food-5", "label": "Make desserts", "category": "food", "sort": 560}, {"id": "food-6", "label": "Defrost & marinade the meat", "category": "food", "sort": 570}, {"id": "food-7", "label": "Prepare BBQ", "category": "food", "sort": 580}, {"id": "food-8", "label": "Peel & boil potatoes", "category": "food", "sort": 590}, {"id": "food-9", "label": "Cut vegetables & prepare", "category": "food", "sort": 600}, {"id": "food-10", "label": "Make dip & prepare snack tray", "category": "food", "sort": 610}, {"id": "drinks-1", "label": "Check wine, beer, spirits, mixers, coke, juice, water", "category": "drinks", "sort": 620}, {"id": "drinks-2", "label": "Make ice", "category": "drinks", "sort": 630}, {"id": "drinks-3", "label": "Prep drinks table", "category": "drinks", "sort": 640}, {"id": "drinks-4", "label": "Prepare coffee machine", "category": "drinks", "sort": 650}, {"id": "drinks-5", "label": "Prepare coffee tray & chocolates", "category": "drinks", "sort": 660}, {"id": "table-1", "label": "Set table/trays", "category": "table", "sort": 670}, {"id": "table-2", "label": "Wrap cutlery", "category": "table", "sort": 680}, {"id": "table-3", "label": "Set the small savoury plates & serviettes", "category": "table", "sort": 690}]};
const CFG = window.APP_CONFIG || {};
const LIVE = !!(CFG.supabaseUrl && CFG.supabaseKey && !/PASTE/.test(CFG.supabaseUrl + CFG.supabaseKey));
const PEOPLE = [
  {name:"Daniel", color:"#3B6FB6"},
  {name:"Kylie",  color:"#C2577A"},
  {name:"Harry",  color:"#3F8A5C"},
  {name:"Tara",   color:"#B87414"},
  {name:"Bridget",color:"#7A5BB5"}
];
const CATS = DATA.cats;
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(_){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} }
};

let tasks = [];
let me = ls.get("me", null);
let filter = ls.get("filter", "all");
let hideDone = ls.get("hideDone", false);
let closed = new Set(ls.get("closed", []));
let writing = 0;
let lastSync = null;
let loadError = false;

const $ = id => document.getElementById(id);
function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k==="class") e.className = v;
    else if (k==="html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v!==false && v!=null) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c!=null) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const person = n => PEOPLE.find(p => p.name===n);
function avatar(name, lg){
  const p = person(name) || {name: name||"?", color:"#888"};
  return el("span", {class:"av"+(lg?" lg":""), style:`background:${p.color}`, "aria-hidden":"true"}, p.name[0]);
}
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600);
}
function when(iso){
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const time = d.toLocaleTimeString("en-NZ", {hour:"numeric", minute:"2-digit"});
  return d.toDateString()===now.toDateString() ? time : d.toLocaleDateString("en-NZ",{weekday:"short"})+" "+time;
}

/* ---------- data layer (Supabase or this-phone demo) ---------- */
async function api(path, opts={}){
  const h = {"apikey": CFG.supabaseKey, "Content-Type":"application/json"};
  if (!CFG.supabaseKey.startsWith("sb_")) h.Authorization = "Bearer " + CFG.supabaseKey;
  const r = await fetch(CFG.supabaseUrl.replace(/\/+$/,"") + "/rest/v1/" + path, {...opts, headers:{...h, ...(opts.headers||{})}});
  if (!r.ok) throw new Error(r.status + " " + (await r.text()));
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}
const store = {
  async load(){
    if (LIVE) return api("tasks?select=*&order=sort.asc");
    let t = ls.get("demoTasks", null);
    if (!t){ t = DATA.seed.map(r => ({...r, assignee:null, done:false, done_by:null, done_at:null})); ls.set("demoTasks", t); }
    return t;
  },
  async update(id, patch){
    if (LIVE) return api("tasks?id=eq."+encodeURIComponent(id), {method:"PATCH", body:JSON.stringify(patch), headers:{Prefer:"return=minimal"}});
    ls.set("demoTasks", tasks);
  },
  async updateAll(patch){
    if (LIVE) return api("tasks?id=not.is.null", {method:"PATCH", body:JSON.stringify(patch), headers:{Prefer:"return=minimal"}});
    ls.set("demoTasks", tasks);
  },
  async insert(row){
    if (LIVE) return api("tasks", {method:"POST", body:JSON.stringify(row), headers:{Prefer:"return=minimal"}});
    ls.set("demoTasks", tasks);
  },
  async remove(id){
    if (LIVE) return api("tasks?id=eq."+encodeURIComponent(id), {method:"DELETE", headers:{Prefer:"return=minimal"}});
    ls.set("demoTasks", tasks);
  }
};

async function refresh(){
  if (writing) return;
  try{
    const rows = await store.load();
    if (writing) return;
    tasks = rows; lastSync = new Date(); loadError = false;
  }catch(e){
    loadError = true; console.error(e);
  }
  render();
}

async function change(fn, write, okMsg){
  const before = JSON.parse(JSON.stringify(tasks));
  fn(); render();
  writing++;
  try{ await write(); if (okMsg) toast(okMsg); }
  catch(e){ console.error(e); tasks = before; toast("That didn’t save – check the internet and try again."); }
  finally{ writing--; render(); }
}

/* ---------- actions ---------- */
function needMe(){ if (!me){ showWelcome(); return true; } return false; }

function toggleDone(t){
  if (needMe()) return;
  const patch = t.done ? {done:false, done_by:null, done_at:null}
                       : {done:true, done_by:me, done_at:new Date().toISOString()};
  change(() => Object.assign(t, patch), () => store.update(t.id, patch));
}
function assign(t, name){
  const patch = {assignee: name};
  change(() => Object.assign(t, patch), () => store.update(t.id, patch),
    name ? (name===me ? "On your list ✓" : `Given to ${name}`) : "Back up for grabs");
}
function addJob(cat){
  const inp = el("input", {class:"field", maxlength:"120", placeholder:"Type the new job", "aria-label":"New job", enterkeyhint:"done", autocomplete:"off"});
  const save = () => {
    const label = inp.value.trim().replace(/\s+/g, " ");
    if (!label){ inp.focus(); return; }
    closeSheet();
    const row = {id:"c-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), label, category:cat.id,
                 sort: Math.max(0, ...tasks.filter(t=>t.category===cat.id).map(t=>t.sort)) + 1,
                 assignee:null, done:false, done_by:null, done_at:null};
    change(() => tasks.push(row), () => store.insert({id:row.id, label:row.label, category:row.category, sort:row.sort}), "Job added");
  };
  inp.addEventListener("keydown", e => { if (e.key==="Enter"){ e.preventDefault(); save(); } });
  openSheet(
    el("h2", {}, `Add a job to ${cat.name}`),
    inp,
    el("button", {class:"opt go", onclick:save}, "Add job"),
    el("button", {class:"opt plain", onclick:closeSheet}, "Cancel")
  );
  inp.focus();
}
function confirmSheet(title, msg, yes, fn){
  openSheet(
    el("h2", {}, title),
    el("p", {}, msg),
    el("button", {class:"opt danger", onclick:() => { closeSheet(); fn(); }}, yes),
    el("button", {class:"opt plain", onclick:closeSheet}, "Cancel")
  );
}
function deleteJob(t){
  confirmSheet(`Delete “${t.label}”?`, "This takes it off the list for everyone.", "Delete this job",
    () => change(() => tasks = tasks.filter(x => x!==t), () => store.remove(t.id), "Job deleted"));
}
function resetList(keepNames){
  confirmSheet(keepNames ? "Untick every job?" : "Clear ticks and names?",
    keepNames ? "Every tick is cleared for everyone. Names stay on their jobs." : "Every tick and name is cleared for everyone.",
    keepNames ? "Clear the ticks" : "Clear ticks and names",
    () => {
      const patch = keepNames ? {done:false, done_by:null, done_at:null}
                              : {done:false, done_by:null, done_at:null, assignee:null};
      change(() => tasks.forEach(t => Object.assign(t, patch)), () => store.updateAll(patch), "Fresh list – ready for next time");
    });
}

/* ---------- sheets ---------- */
function openSheet(...content){
  const scrim = el("div", {class:"scrim", onclick:e => { if (e.target===scrim) closeSheet(); }},
    el("div", {class:"sheet", role:"dialog", "aria-modal":"true"}, ...content));
  $("overlay").replaceChildren(scrim);
  const f = scrim.querySelector("button"); if (f) f.focus({preventScroll:true});
}
function closeSheet(){ $("overlay").replaceChildren(); }
document.addEventListener("keydown", e => { if (e.key==="Escape") closeSheet(); });

function taskSheet(t){
  const opts = PEOPLE.map(p => el("button", {class:"opt"+(t.assignee===p.name?" sel":""), onclick:() => { closeSheet(); assign(t, p.name); }},
    avatar(p.name), el("span", {}, p.name===me ? p.name+" (me)" : p.name)));
  openSheet(
    el("h2", {}, t.label),
    el("p", {}, t.done ? `Done by ${t.done_by||"someone"}, ${when(t.done_at)}` : "Who’s doing this job?"),
    ...opts,
    el("button", {class:"opt"+(!t.assignee?" sel":""), onclick:() => { closeSheet(); assign(t, null); }}, "Nobody yet – up for grabs"),
    el("button", {class:"opt danger", onclick:() => deleteJob(t)}, "Delete this job"),
    el("button", {class:"opt plain", onclick:closeSheet}, "Close")
  );
}
function menuSheet(){
  const done = tasks.filter(t=>t.done).length;
  openSheet(
    el("h2", {}, "Start fresh for next visit"),
    el("p", {}, `${done} of ${tasks.length} jobs are ticked. Clearing changes the list on everyone’s phone.`),
    el("button", {class:"opt", onclick:() => resetList(true)},
      el("span", {}, "Clear the ticks", el("small", {}, "Keep everyone’s names on their jobs"))),
    el("button", {class:"opt danger", onclick:() => resetList(false)},
      el("span", {}, "Clear ticks and names", el("small", {}, "A completely blank list"))),
    el("button", {class:"opt", onclick:() => { closeSheet(); showWelcome(); }}, "Switch person on this phone"),
    el("button", {class:"opt plain", onclick:closeSheet}, "Close")
  );
}
function showWelcome(){
  const ov = el("div", {class:"welcome", role:"dialog", "aria-modal":"true"},
    el("div", {class:"inner"},
      el("h2", {}, "Who’s this?"),
      el("p", {}, "Pick your name. This phone will remember you."),
      ...PEOPLE.map(p => el("button", {class:"opt"+(me===p.name?" sel":""), onclick:() => {
        me = p.name; ls.set("me", me); $("overlay").replaceChildren(); render();
      }}, avatar(p.name, true), el("span", {style:"font-size:1.1rem"}, p.name)))
    ));
  $("overlay").replaceChildren(ov);
}

/* ---------- render ---------- */
function render(){
  const total = tasks.length, done = tasks.filter(t=>t.done).length;
  $("count").textContent = `${done} of ${total} done`;
  $("bar").style.width = total ? (done/total*100)+"%" : "0";

  const meBtn = $("meBtn");
  meBtn.replaceChildren(...(me ? [avatar(me), me] : ["Who are you?"]));
  meBtn.onclick = showWelcome;
  $("menuBtn").onclick = menuSheet;

  const mine = tasks.filter(t => t.assignee===me);
  const free = tasks.filter(t => !t.assignee);
  const F = [
    ["all", "Everything"],
    ["mine", `My jobs${me ? " · "+mine.filter(t=>!t.done).length : ""}`],
    ["free", `Up for grabs · ${free.filter(t=>!t.done).length}`],
    ["hide", hideDone ? "Showing to-do only" : "Hide done"]
  ];
  $("filters").replaceChildren(...F.map(([k,l]) => el("button", {
    "aria-pressed": String(k==="hide" ? hideDone : filter===k),
    onclick:() => {
      if (k==="hide"){ hideDone=!hideDone; ls.set("hideDone",hideDone); }
      else { filter=k; ls.set("filter",k); }
      render(); window.scrollTo({top:0});
    }}, l)));
  document.body.classList.toggle("hide-done", hideDone);

  $("people").replaceChildren(...PEOPLE.map(p => {
    const theirs = tasks.filter(t => t.assignee===p.name);
    const left = theirs.filter(t => !t.done).length;
    return el("div", {class:"pcard"}, avatar(p.name),
      el("div", {}, el("b", {}, p.name), el("span", {}, theirs.length ? (left ? `${left} to do` : "all done ✓") : "no jobs yet")));
  }));

  const b = $("banner");
  if (!LIVE){ b.hidden=false; b.className="banner"; b.textContent="Preview: have a play – tap a name, claim and tick jobs, try ⋯ to clear the list. Ticks here are only saved on this device; the real app shares them with the family."; }
  else if (loadError){ b.hidden=false; b.className="banner warn"; b.textContent="Can’t reach the list right now. Check the internet – it will keep trying."; }
  else b.hidden = true;
  $("status").textContent = LIVE && lastSync ? "Updated " + lastSync.toLocaleTimeString("en-NZ",{hour:"numeric",minute:"2-digit"}) : "";

  const main = $("main"); main.replaceChildren();
  const known = new Set(CATS.map(c=>c.id));
  const cats = [...CATS, ...[...new Set(tasks.map(t=>t.category).filter(c=>!known.has(c)))].map(id=>({id, name:id, emoji:"📋"}))];
  const pass = t => filter==="mine" ? t.assignee===me : filter==="free" ? !t.assignee : true;
  let shown = 0;

  for (const cat of cats){
    const all = tasks.filter(t => t.category===cat.id).sort((a,b)=>a.sort-b.sort);
    const list = all.filter(pass);
    if (!list.length && filter!=="all") continue;
    const visible = list.filter(t => !(hideDone && t.done)).length;
    if (filter!=="all" && hideDone && !visible) continue;
    shown += visible;
    const d = list.filter(t=>t.done).length;
    const sec = el("section", {class:(closed.has(cat.id)?"closed ":"")+(list.length && d===list.length?"complete":"")});
    sec.append(el("button", {class:"sechead", "aria-expanded":String(!closed.has(cat.id)), onclick:() => {
        closed.has(cat.id) ? closed.delete(cat.id) : closed.add(cat.id); ls.set("closed",[...closed]); render();
      }},
      el("span", {class:"em", "aria-hidden":"true"}, cat.emoji), el("span", {class:"nm"}, cat.name),
      el("span", {class:"ct"}, d===list.length && list.length ? "✓ all done" : `${d}/${list.length}`),
      el("span", {class:"chev", "aria-hidden":"true"}, "▾")));
    const ul = el("ul");
    for (const t of list){
      const meta = t.done ? `${t.done_by===me ? "you" : (t.done_by||"someone")}, ${when(t.done_at)}` : null;
      ul.append(el("li", {class:t.done?"done":""},
        el("button", {class:"tick", role:"checkbox", "aria-checked":String(!!t.done), "aria-label":t.label, onclick:() => toggleDone(t)},
          el("span", {class:"box", html:CHECK})),
        el("button", {class:"body", onclick:() => taskSheet(t)},
          el("span", {class:"label"}, t.label), meta && el("span", {class:"meta"}, meta)),
        t.assignee
          ? el("button", {class:"who", "aria-label":`${t.assignee}’s job – change`, onclick:() => taskSheet(t)}, avatar(t.assignee))
          : el("button", {class:"who", onclick:() => { if (!needMe()) assign(t, me); }}, el("span", {class:"claim"}, "Claim"))
      ));
    }
    sec.append(ul, el("button", {class:"add", onclick:() => addJob(cat)}, "+ Add a job"));
    main.append(sec);
  }

  if (tasks.length && !shown){
    main.append(el("div", {class:"empty"},
      filter==="mine" ? [el("strong", {}, mine.length ? "All your jobs are done!" : "Nothing on your list yet"),
                         mine.length ? "Have a look in Up for grabs." : "Tap Claim on any job to put it on your list."]
      : [el("strong", {}, "All done!"), "Nothing left to do here."]));
  }
}

/* ---------- start ---------- */
render();
refresh().then(() => { if (!me) showWelcome(); });
setInterval(() => { if (document.visibilityState==="visible") refresh(); }, 5000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState==="visible") refresh(); });
</script>
</body>
</html>
